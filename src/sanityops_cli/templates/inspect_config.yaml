# ============================================================================
# Sanityops CLI - Inspect Configuration Template
# ============================================================================
# Usage:
#   1. Run: sanityops-cli init
#   2. Fill in model configuration below (required)
#   3. Connect to the Sanityops service:
#      sanityops-cli config server.base_url "<your-server-url>"
#      sanityops-cli config server.api_key
#   4. Configure artifact paths below
#   5. Run: sanityops-cli inspect
#      (A project is created automatically on first upload and the
#      project id/name are written back to this file.)
# ============================================================================

# Project metadata
# id: Left as a placeholder. A real project id is assigned automatically
#     on first inspect upload (project auto-created), or set it manually.
# name: Project display name (optional, filled automatically on first upload)
project:
  id: "00000000-0000-0000-0000-000000000000"
  name: ""

# Model configuration
# Fill in the fields below, or remove this section entirely to configure
# via LLM_* environment variables instead:
#   LLM_PROVIDER, LLM_API_KEY, LLM_MODEL_ID, LLM_BASE_URL
model:
  provider: anthropic                 # Required: anthropic, openai, azure, etc.
  api_key: ""                         # Required: your API key (keep this file out of git)
  model_id: claude-sonnet-4-20250514  # Required: model identifier
  base_url: ""                        # Optional: custom endpoint URL

# Agent configuration (optional)
# Override CLI defaults for timeout and token budget.
# agent:
#   timeout: 1800      # seconds (default: 1800, 30min)
#   token_budget: 200000

# System Prompt file list (supports any plaintext file format)
prompts:
  - file: prompts/system_prompt.md
  - file: prompts/fallback_prompt.py
  - file: prompts/summary_prompt.ts

# Tools Schema file list (supports any plaintext file format)
tools:
  - file: tools/search_tools.json
  - file: tools/file_ops.py
  - file: tools/code_tools.ts

# Skills file list (supports any plaintext file format)
skills:
  - file: skills/code_review.md
  - file: skills/code_fix/skill.md
