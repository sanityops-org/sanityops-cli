# ============================================================================
# deeplogic CLI - Inspect Configuration Template
# ============================================================================
# Usage:
#   1. Run: deeplogic-cli init
#   2. Fill in model configuration below (required)
#   3. (Optional) Bind to a project:
#      - Create new: deeplogic-cli project create <name>
#      - Or bind existing: deeplogic-cli project bind <project-id>
#   4. Configure artifact paths below
#   5. Run: deeplogic-cli inspect
#   6. Push to server: deeplogic-cli project push -m "message"
# ============================================================================

# Project metadata
# id: Filled by 'project create' or 'project bind' (required for push)
# name: Project display name (optional, set by 'project create')
project:
  id: "00000000-0000-0000-0000-000000000000"
  name: ""

# Model configuration (required unless configured via LLM_* environment variables)
# Configure your LLM provider and credentials here.
# Alternatively, you can use environment variables:
#   LLM_PROVIDER, LLM_API_KEY, LLM_MODEL_ID, LLM_BASE_URL, LLM_ENABLE_THINKING
model:
  provider: anthropic                 # Required: anthropic, openai, dashscope
  api_key: ""                         # Required: your API key (keep this file out of git)
  model_id: claude-sonnet-4-20250514  # Required: model identifier
  base_url: ""                        # Optional: custom endpoint URL
  # Optional: input limit per model request in tokens, checked using a local estimate.
  # Adjust to match your model endpoint (e.g., 200000 for Claude, 1000000 for 1M-context models).
  context_window: 200000
  # Optional: enable model thinking/reasoning mode (default: true).
  # Set to false to disable thinking; falls back automatically if the endpoint rejects it.
  enable_thinking: true

# Logging configuration
# Controls execution logging for debugging and audit purposes.
# Default: <config-file-dir>/logs (auto-created, no need to configure).
# Uncomment 'directory' below to override the default location.
logging:
  enabled: true
  level: INFO
  # directory: ./logs
  retention_days: 30
  redact_api_keys: true

# Defect check configuration (optional)
# Controls defect-check behavior and execution flags.
defect_check:
  # force_permission: false       # Force run QD-PM even if Gate-0 preconditions fail (cli: --force-pm)
  # concurrency: 2                # Max concurrent LLM calls (recommended: 2-3 for local/private GPU, 5 for cloud)
  # request_timeout: 120          # Per-request LLM timeout in seconds (default: 120s)

# ============================================================================
# System Prompt 文件配置
# 【核心约束】智能体合规检测规范：每个 Agent 仅支持配置【单一】System Prompt！
# 系统在单工件（QDP）、跨工件（Cross）及权限（QD-PM）检查中，均以该核心 System Prompt 作为唯一判定基线。
# 请仅配置 1 个主 Prompt 文件（若配置多个，系统将仅取首个生效）。
# ============================================================================
prompts:
  - file: prompts/system_prompt.md

# Tools Schema file list (supports any plaintext file format)
tools:
  - file: tools/search_tools.json
  - file: tools/file_ops.py
  - file: tools/code_tools.ts

# Skills file list (file or directory)
skills:
  - file: skills/code_review.md
  - file: skills/code_fix/skill.md
  - file: skills/
