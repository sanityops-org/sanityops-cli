name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.2). If empty, extracts from tag'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.11'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Building version $VERSION"

  # Step 1: Create empty release first
  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 2: Build and publish to PyPI
  pypi-publish:
    needs: [prepare, create-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Step 3: Build all platforms and upload to existing release
  build-all:
    needs: [prepare, create-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pyinstaller typer rich httpx tomli tomli-w
          pip install -e .

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCH="${{ matrix.arch }}"
          if [ "${{ matrix.platform }}" = "darwin" ] && [ "$ARCH" = "x64" ]; then
            export ARCHFLAGS="-arch x86_64"
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            export ARCHFLAGS="-arch arm64"
          fi
          pyinstaller --onefile \
            --name sanityops-cli-${{ matrix.platform }}-$ARCH \
            --collect-data defect_check \
            --collect-data sanityops_cli \
            entry.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name sanityops-cli-win-x64 `
            --collect-data defect_check `
            --collect-data sanityops_cli `
            entry.py

      - name: Upload binaries to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: |
            dist/sanityops-cli-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 4: Package - download all binaries, create checksums and manifest
  package:
    needs: [prepare, create-release, build-all]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all release assets
        uses: robinraju/release-downloader@v1.8
        with:
          tag: v${{ needs.prepare.outputs.version }}
          fileName: "sanityops-cli-*"
          out-file-path: release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum sanityops-cli-* > checksums.txt
          cat checksums.txt

      - name: Create release manifest
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cat > release/release.json << EOF
          {
            "version": "$VERSION",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Copy install scripts
        run: |
          cp scripts/install.sh release/
          cp scripts/install.ps1 release/

      - name: Upload additional files to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 5: Deploy to server
  deploy:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release assets
        uses: robinraju/release-downloader@v1.8
        with:
          tag: v${{ needs.prepare.outputs.version }}
          fileName: "*"
          out-file-path: release/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Create version directory and upload files
          ssh ${DEPLOY_USER}@${DEPLOY_SERVER} "mkdir -p ${DEPLOY_PATH}/${VERSION}"
          rsync -avz release/ ${DEPLOY_USER}@${DEPLOY_SERVER}:${DEPLOY_PATH}/${VERSION}/

          # Update latest symlink
          ssh ${DEPLOY_USER}@${DEPLOY_SERVER} "cd ${DEPLOY_PATH} && rm -rf latest && ln -s ${VERSION} latest"

          # Copy install scripts to root (for curl install)
          ssh ${DEPLOY_USER}@${DEPLOY_SERVER} "cp ${DEPLOY_PATH}/${VERSION}/install.sh ${DEPLOY_PATH}/ && cp ${DEPLOY_PATH}/${VERSION}/install.ps1 ${DEPLOY_PATH}/"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
